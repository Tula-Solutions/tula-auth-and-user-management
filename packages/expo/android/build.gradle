// The Android half of `@tula/expo/native-screens` (ADR 0063): an Expo module that draws
// Tula's Compose screens on Tula's Kotlin client.
//
// Nothing of the Kotlin SDK is published, so this module compiles the SDK's sources itself:
// `vendor/` holds a copy of `tula-auth`, `tula-auth-ui`, `tula-auth-android` and
// `tula-auth-compose`, made when the npm package is built (`scripts/vendor-native.ts`) and
// never edited. They are compiled here with the app's own Kotlin and Android Gradle plugin
// (the versions Expo and React Native pin), not with the SDK's own build
// (`native/android`).
//
// THE LIBRARIES BELOW ARE OLDER THAN THE ONES THE SDK IS TESTED ON, every one of them, on
// purpose. The SDK's catalog (`native/android/gradle/libs.versions.toml`) is for Kotlin 2.4;
// an Expo SDK 57 app compiles with Kotlin 2.1, which reads Kotlin metadata up to 2.2. With
// every library at the catalog's version the build brings a Kotlin 2.3 standard library and
// fails; kotlinx.serialization 1.11.0 (metadata 2.3) and googleid 1.2.1 (2.4) are past that
// by themselves. The other six were tried only together with those, never one alone, so
// for them "cannot" is not shown: they are kept at the versions that were compiled. So the
// vendored SDK is compiled here against libraries its own tests never ran on, and none of the
// SDK's tests runs against this build. `.claude/hooks/expo-native-libraries.test.ts` holds
// every difference to a list with its reason, and Dependabot watches this file
// (`.github/dependabot.yml`). docs/expo.md and ADR 0063 say what was compiled with which.
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    // The two compiler plugins the SDK's sources need, at the app's Kotlin version: the
    // Compose compiler and kotlinx.serialization's.
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
    classpath("org.jetbrains.kotlin:kotlin-serialization:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

group = 'dev.tula'
version = '0.0.0'

android {
  namespace "dev.tula.expo.screens"
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
    // No `minSdkVersion` of its own, on purpose. `tula-auth-android` is written for
    // Android 9 (API 28) and later (ADR 0054), but Expo links this module into every app
    // that installs `@tula/expo`, also one that only uses the headless client: with 28
    // declared here such an app, at Expo's default of 24, fails its manifest merge. So
    // the config plugin raises the project's value where the app asks for the screens
    // (`nativeScreens`), and `configure` refuses on an older device.
  }
  buildFeatures {
    compose true
  }
  sourceSets {
    main {
      // The vendored SDK, one directory a module of `native/android`.
      java.srcDirs += [
        'vendor/tula-auth',
        'vendor/tula-auth-ui',
        'vendor/tula-auth-android',
        'vendor/tula-auth-compose',
      ]
    }
  }
}

dependencies {
  // What `tula-auth` is written on.
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  // What `tula-auth-compose` is written on: foundation and UI only, no Material.
  implementation "androidx.compose.ui:ui:1.8.3"
  implementation "androidx.compose.foundation:foundation:1.8.3"
  implementation "androidx.activity:activity-compose:1.10.1"
  // What `tula-auth-android` is written on: Credential Manager and Google's ID token.
  implementation "androidx.credentials:credentials:1.5.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
