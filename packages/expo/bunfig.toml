[test]
# A renderer for the hooks' tests: registers happy-dom's globals before any test file loads.
# The package itself has no DOM in it (`package.test.ts` holds that).
preload = ["./src/testing/setup.ts"]
coverageSkipTestFiles = true
coverageThreshold = { lines = 0.9, functions = 0.9 }
# Other packages measure their own coverage; count only this package's files here.
coveragePathIgnorePatterns = ["../contract/**", "../core/**", "../db/**", "../conformance/**", "../../apps/**", "src/testing/**"]
