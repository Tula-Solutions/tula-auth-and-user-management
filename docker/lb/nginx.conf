# One address in front of the two packaged API instances (the `lb` service of the Compose `app`
# profile; docs/self-host.md, "Redis and more than one instance"). It exists so that the conformance scenarios
# can be run the way a real deployment is reached: every request goes to whichever instance is
# next, so anything one instance keeps to itself shows up as a failure.
#
# It is a development and CI fixture, not a production proxy: plain HTTP, no limits of its own.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  # The instance that answered, so a run can be checked to have reached both. `$uri` is the path
  # alone: an OAuth callback carries its code and state in the query string, which must not be
  # logged, and no header (keys, attempt secrets, cookies) is ever written here.
  log_format upstream '$request_method $uri $status upstream=$upstream_addr';
  access_log /dev/stdout upstream;

  # Round robin (the default): requests alternate. No `ip_hash` or other stickiness, which would
  # hide state that is not shared.
  upstream tula_api {
    server api:3003;
    server api-2:3003;
  }

  server {
    listen 8080;
    server_tokens off;

    location / {
      proxy_pass http://tula_api;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      # What the API is told the client's address is (it reads the last entry of
      # X-Forwarded-For when TRUST_PROXY=true). One of forwarded-for.peer.conf (the default:
      # the peer this proxy saw) or forwarded-for.client.conf (LB_CLIENT_ADDRESS=client: for
      # the conformance run only), mounted by docker-compose.yml.
      include /etc/nginx/forwarded-for.conf;
      # Both lines here are right for the edge proxy only, the one clients connect to. Behind
      # another proxy `$remote_addr` and `$scheme` describe that proxy: take the client's
      # address from it with nginx's real-IP handling (`set_real_ip_from <its address>;` and
      # `real_ip_header X-Forwarded-For;`) and pass the scheme it reports through.
      proxy_set_header X-Forwarded-Proto $scheme;
      # A request that failed on one instance is never replayed on the other: a retried POST
      # would spend a code or count a guess twice.
      proxy_next_upstream off;
    }
  }
}
