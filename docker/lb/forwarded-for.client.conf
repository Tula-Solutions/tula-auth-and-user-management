# For the conformance run only (LB_CLIENT_ADDRESS=client). The runner sends every scenario
# from an address of its own in X-Forwarded-For, playing the edge proxy of a real deployment:
# all scenarios from one address would run into the per-address rate limits and test nothing
# but them. This passes that header through unchanged, which means ANY client can choose its
# rate-limit bucket. Never use it where anyone but the test runner can reach the proxy.
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
