# Local V1 stack (business plan §5.8). `docker compose up -d` then `bun run dev`.
# Ports bind to 127.0.0.1 only: Docker bypasses host firewalls, and these services use dev
# credentials (Redis and Mailpit have none), so they must not be reachable from the LAN.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tula
      POSTGRES_PASSWORD: tula
      POSTGRES_DB: tula
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tula -d tula']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local inbox for verification emails: SMTP on 1025, web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

volumes:
  postgres-data:
