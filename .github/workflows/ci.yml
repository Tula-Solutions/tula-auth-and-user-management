name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. On `develop` and `main` a run
# in progress is never cancelled by a later push: it finishes, and the newest push runs next.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are referenced by tag on purpose: Dependabot follows them (.github/dependabot.yml).

jobs:
  # The same files are often checked more than once: `develop` and then the release pull
  # request into `main`, or a branch fast-forwarded to a commit another branch already ran. A
  # push that passes every job leaves a marker named after the git tree it checked (`passed`,
  # at the end of this file); a later run of the identical tree finds it here and skips its
  # jobs. The tree covers every file, this workflow included, so "identical" means no file a
  # job reads has changed.
  #
  # Only a push writes a marker, and a push never reads Turborepo's cache (see `verify`), so a
  # marker always stands for a run that did all the work. A pull request's run therefore never
  # vouches for anything: the push that follows its merge runs in full.
  #
  # Two runs are never skipped: a push to `main` (a release is always checked in full), and a
  # tree whose only marker came from a fork's run.
  duplicate:
    name: already passed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.look.outputs.tree }}
      skip: ${{ steps.look.outputs.skip }}
    steps:
      # On a pull request this is the merge with the base branch: the tree the jobs would check.
      - uses: actions/checkout@v7
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          skip=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "A push to main always runs in full."
          # A lookup that fails is "no marker": the jobs run.
          elif gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$tree&per_page=100" \
            --jq 'any(.artifacts[]; .expired == false and .workflow_run.head_repository_id == (env.REPOSITORY_ID | tonumber))' |
            grep -qx true; then
            skip=true
            echo "Tree $tree has already passed every job: skipping them."
          else
            echo "Tree $tree has not passed yet: running every job."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
        shell: bash -euo pipefail {0}

  verify:
    needs: duplicate
    if: needs.duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tula
          POSTGRES_PASSWORD: tula
          POSTGRES_DB: tula
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tula -d tula"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The Redis adapters' Lua scripts are only proved against a real server
      # (apps/api/src/adapters/redis/redis.integration.ts, part of `test:integration`).
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://tula_api:tula_api@localhost:5432/tula
      DATABASE_MIGRATION_URL: postgres://tula:tula@localhost:5432/tula
      REDIS_TEST_URL: redis://localhost:6379
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      # Turborepo's record of the typecheck and test tasks that passed. A pull request starts
      # from the newest one a push saved, and so redoes only the packages whose inputs changed
      # since: quick feedback, as safe as those inputs are complete
      # (.claude/hooks/turbo-inputs.test.ts). A push never reads it: what lands on `develop`
      # and `main` is checked from scratch, and that run's record is the one saved, so the
      # cache never carries anything a pull request wrote.
      - name: Restore the Turborepo cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: bun run verify
      - name: Save the Turborepo cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
      - name: Create database roles (mirrors docker/postgres/init.sql)
        run: psql "$DATABASE_MIGRATION_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql
      - run: bun run db:migrate
      - run: bun run test:integration

  # Browser behaviour is tested in a browser (Phase 1 plan, rule 3): the example app, built only
  # from @tula/react components, against the real API served in process with memory adapters
  # (e2e/server.ts), driven by Playwright, with axe on every screen in light and dark. Its own
  # job, not part of `bun run verify`: it needs a browser download.
  e2e:
    needs: duplicate
    if: needs.duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - name: Install Chromium and its system libraries
        run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # The packaged server, as a self-hoster runs it: build the image, start two instances of it
  # with Compose, and run the conformance scenarios against them over HTTP. The `two instances`
  # scenario signs in through one and out through the other, and spreads wrong passwords over
  # both, so this job is what proves the instances share their state (ADR 0016).
  #
  # It runs twice, side by side. `two-ports` talks to each instance on its own port, which is
  # the only way to say which instance a step went to. `one-address` sends every scenario
  # through the proxy in front of both (`lb`, round robin), as a real deployment is reached:
  # the Phase 1 exit criterion "two packaged instances behind one address"
  # (conformance/README.md, "Behind one address").
  self-host:
    name: self-host (${{ matrix.mode }})
    needs: duplicate
    if: needs.duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # A full run is about ten minutes of waiting the scenarios ask for; through the one
    # address, about six more for the settings to reach the other instance after each change.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: two-ports
            base_url: http://localhost:3003
            second_base_url: http://localhost:3004
            public_url: ''
            lb_client_address: peer
            settle_ms: '0'
          - mode: one-address
            base_url: http://localhost:3005
            second_base_url: ''
            # The issuer of the tokens, and where the mock provider's pages are reached.
            public_url: http://localhost:3005
            # The runner sends each scenario from its own address in X-Forwarded-For; the
            # proxy passes it through for this run only (docker/lb/forwarded-for.client.conf).
            lb_client_address: client
            settle_ms: '6000'
    env:
      API_PUBLIC_URL: ${{ matrix.public_url }}
      LB_CLIENT_ADDRESS: ${{ matrix.lb_client_address }}
      # Throwaway values for this job's own containers.
      TULA_MASTER_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      TRUST_PROXY: 'true'
      # The OAuth scenarios run against the API's own mock provider (ADR 0026). Compose runs
      # the stack in the `local` tier, the only one the API accepts this in.
      OAUTH_MOCK_PROVIDER: 'true'
      # The phone number scenario reads its codes from the development SMS inbox (ADR 0037),
      # accepted in the `local` tier only like the mock provider.
      SMS_PROVIDER: dev
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - name: Build and start the stack
        run: docker compose --profile app up -d --build
      - name: Wait until both API instances are ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3003/v1/ready > /dev/null &&
              curl -fsS http://localhost:3004/v1/ready > /dev/null &&
              curl -fsS http://localhost:3005/v1/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "the API instances did not both become ready" >&2
          exit 1
      - name: The image serves the dashboard under its Content-Security-Policy
        if: matrix.mode == 'two-ports'
        run: |
          set -euo pipefail
          headers=$(curl -fsS -o /dev/null -D - http://localhost:3003/dashboard/)
          echo "$headers" | grep -i '^content-security-policy:' | grep -F "script-src 'self'" > /dev/null
          if echo "$headers" | grep -i '^content-security-policy:' | grep -q 'unsafe-'; then
            echo "the dashboard's Content-Security-Policy allows something unsafe" >&2
            exit 1
          fi
          # The page is the app (a script of this origin), and a missing asset is a 404, not HTML.
          curl -fsS http://localhost:3003/dashboard/ | grep -q '/dashboard/assets/'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3003/dashboard/assets/missing.js)" = 404
          # Only the static files: no React and no dashboard sources in the image.
          docker compose --profile app run --rm -T api sh -c \
            '! test -e /usr/src/app/node_modules/react && ! test -e /usr/src/app/apps/dashboard/src'
      - name: Create an environment and its keys
        run: |
          # Without pipefail a failed command before `| tail` would be swallowed, and an empty
          # secret key would make the admin scenarios skip instead of fail.
          set -euo pipefail
          compose() { docker compose --profile app run --rm -T api "$@"; }
          seed=$(compose bun run ../../packages/db/src/scripts/seed.ts)
          environment=$(echo "$seed" | awk '/development environment/ {print $NF}')
          if ! echo "$environment" | grep -Eq '^[0-9a-f-]{36}$'; then
            echo "seed did not print a development environment id" >&2
            exit 1
          fi
          for kind in publishable secret; do
            minted=$(compose bun run src/scripts/create-api-key.ts --environment "$environment" --kind "$kind")
            key=$(echo "$minted" | tail -1)
            case "$key" in
              tula_pk_* | tula_sk_*) ;;
              *) echo "could not create a $kind key" >&2; exit 1 ;;
            esac
            echo "::add-mask::$key"
            name=$(echo "$kind" | tr '[:lower:]' '[:upper:]')
            echo "CONFORMANCE_${name}_KEY=$key" >> "$GITHUB_ENV"
          done
      - name: Run the conformance scenarios against both instances
        env:
          CONFORMANCE_BASE_URL: ${{ matrix.base_url }}
          CONFORMANCE_SECOND_BASE_URL: ${{ matrix.second_base_url }}
          CONFORMANCE_SETTLE_MS: ${{ matrix.settle_ms }}
          # Each instance keeps its own inbox, and through the one address a request may reach
          # either: the runner asks both, on their own ports, in both modes.
          CONFORMANCE_SMS_INBOX_URLS: http://localhost:3003,http://localhost:3004
        run: |
          # Every scenario must run: a missing secret key would skip the admin ones.
          test -n "$CONFORMANCE_PUBLISHABLE_KEY" && test -n "$CONFORMANCE_SECRET_KEY"
          bun run conformance | tee conformance.log
          # `bun run --filter` prefixes every line with the package name, so none of these
          # patterns may be anchored to the start of a line.
          #
          # Nine scenarios are skipped here, and only those nine, by name. Eight have a receiver
          # (of a webhook, or of a hook), which is a listener on this runner that a server in a
          # container can reach only at a private address, and the server's outbound guard
          # refuses those (conformance/README.md, "The webhook scenarios need a receiver the
          # server can reach"). The ninth, "password expiry", waits a day for a password to
          # expire, which only a clock the runner can move makes possible (conformance/README.md,
          # "A scenario that waits longer than a run can sleep"). All nine run in process in
          # the verify job. The check is the exact set of
          # names, both ways: a scenario skipped that is not listed fails, and so does a listed
          # one that was not skipped (it would mean the list is stale). A count alone would let
          # one skip stand in for another.
          expected=$(printf '%s\n' \
            'claims added by a hook' \
            'hook that times out' \
            'password expiry' \
            'sign-in denied by a hook' \
            'sign-in hook that times out' \
            'sign-up denied by a hook' \
            'webhook delivered and signed' \
            'webhook retried after a 500' \
            'webhook secret rotated with an overlap' | sort)
          skipped=$(grep -Eo '(^|: )SKIPPED .*$' conformance.log |
            sed -E 's/^(: )?SKIPPED //' | sort || true)
          if [ "$skipped" != "$expected" ]; then
            echo "the scenarios skipped are not exactly the ones expected" >&2
            echo "expected:" >&2; echo "$expected" >&2
            echo "skipped:" >&2; echo "$skipped" >&2
            exit 1
          fi
          grep -Eq '(^|: )PASSED two instances$' conformance.log
          # The outbound guard's refusals at save time need no receiver: they run here,
          # against the packaged server and a real Postgres.
          grep -Eq '(^|: )PASSED webhook endpoint on a refused address$' conformance.log
          # The texted code is read from the instances' development inboxes: the scenarios
          # must have run, not been skipped for want of one. The two about the send limits
          # (a blocked destination, the daily limit) each send a message of their own first.
          grep -Eq '(^|: )PASSED phone number on an account$' conformance.log
          grep -Eq '(^|: )PASSED text messages to a blocked destination$' conformance.log
          grep -Eq '(^|: )PASSED text messages past the daily limit$' conformance.log
          # Signing in with a texted code (ADR 0037). The scenario about an unknown number
          # reads no code, and still needs a server that can send one: without a sender the
          # method is not offered at all.
          grep -Eq '(^|: )PASSED sign in with a texted code$' conformance.log
          grep -Eq '(^|: )PASSED a texted sign-in code for an unknown number$' conformance.log
          grep -Eq '(^|: )PASSED a texted sign-in code after the method is switched off$' conformance.log
          # An environment's own words for a text message (ADR 0042): the message is read
          # whole from the inbox, not only its code.
          grep -Eq '(^|: )PASSED text message wording$' conformance.log
          # A texted code as the second step (ADR 0025): enrolment, the sign-in and each
          # refusal read their codes from the same inboxes.
          grep -Eq '(^|: )PASSED a texted code as the second factor$' conformance.log
          grep -Eq '(^|: )PASSED a texted code is never used beside an authenticator app$' conformance.log
          grep -Eq '(^|: )PASSED a texted sign-in code is not completed by a texted second step$' conformance.log
          if [ "${{ matrix.mode }}" = two-ports ]; then
            # The cross-instance scenario must have run against two instances: without the
            # second URL its steps would all go to one server and prove nothing about sharing.
            grep -Eq ' 0 failed, 9 skipped against http://localhost:3003 and http://localhost:3004$' conformance.log
          else
            grep -Eq ' 0 failed, 9 skipped against http://localhost:3005 \(one address, 6000 ms after each settings change\)$' conformance.log
          fi
        shell: bash -euo pipefail {0}
      - name: Both instances answered behind the one address
        if: matrix.mode == 'one-address'
        run: |
          # The proxy logs the instance that answered each request. Round robin over two
          # instances: each must have answered at least a third of them, or the run did not
          # exercise what it claims to.
          docker compose --profile app logs --no-color --no-log-prefix lb > lb.log
          total=$(grep -c 'upstream=' lb.log)
          instances=$(grep -o 'upstream=[0-9.]*:3003' lb.log | sort | uniq -c | awk '{print $1}')
          echo "requests: $total; per instance: $(echo $instances)"
          test "$(echo "$instances" | wc -l)" -eq 2
          for count in $instances; do
            test "$((count * 3))" -ge "$total"
          done
        shell: bash -euo pipefail {0}
      - name: Stack logs
        if: failure()
        run: docker compose --profile app logs --no-color

  # The webhook worker as a service of its own (docs/self-host.md, "The webhook worker as its
  # own service"): the same image, `WEBHOOK_WORKER=separate` on every container. The stack is
  # started WITHOUT the worker first, so the check can see that an API instance delivers
  # nothing; it then starts the worker itself and sees the delivery made.
  #
  # The conformance scenarios with a receiver stay skipped in the jobs above: their receiver
  # is on the runner, at a private address for a server in a container, and the outbound
  # guard refuses those. This job does not loosen the guard either. Its receiver is a
  # container in the worker's own network namespace (docker/worker-check/compose.yml), which
  # the worker reaches on the loopback, allowed in the `local` tier Compose runs the stack in,
  # and which the API instances cannot reach at all: a request it gets is the worker's.
  self-host-worker:
    name: self-host (worker as its own service)
    needs: duplicate
    if: needs.duplicate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The build, then about two minutes: one for an event to count as stuck with no worker.
    timeout-minutes: 20
    env:
      # A throwaway value for this job's own containers.
      TULA_MASTER_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      # Read by Compose for the API instances and for the worker alike.
      WEBHOOK_WORKER: separate
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
      - name: Generate the instance admin token
        run: |
          # The diagnostics are behind it. Generated per run: the API refuses a typed value.
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "TULA_ADMIN_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Build and start the stack, without the worker
        run: docker compose --profile app up -d --build
      - name: Wait until both API instances are ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3003/v1/ready > /dev/null &&
              curl -fsS http://localhost:3004/v1/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "the API instances did not both become ready" >&2
          exit 1
      - name: Create an environment and its secret key
        run: |
          set -euo pipefail
          compose() { docker compose --profile app run --rm -T api "$@"; }
          seed=$(compose bun run ../../packages/db/src/scripts/seed.ts)
          environment=$(echo "$seed" | awk '/development environment/ {print $NF}')
          if ! echo "$environment" | grep -Eq '^[0-9a-f-]{36}$'; then
            echo "seed did not print a development environment id" >&2
            exit 1
          fi
          minted=$(compose bun run src/scripts/create-api-key.ts --environment "$environment" --kind secret)
          key=$(echo "$minted" | tail -1)
          case "$key" in
            tula_sk_*) ;;
            *) echo "could not create a secret key" >&2; exit 1 ;;
          esac
          echo "::add-mask::$key"
          echo "WORKER_CHECK_SECRET_KEY=$key" >> "$GITHUB_ENV"
      - name: A webhook is delivered by the worker, and by no API instance
        run: |
          set -euo pipefail
          export WORKER_CHECK_ADMIN_TOKEN="$TULA_ADMIN_TOKEN"
          bun run scripts/worker-check/check.ts -- docker compose -f docker-compose.yml -f docker/worker-check/compose.yml --profile app --profile worker
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker/worker-check/compose.yml --profile app --profile worker logs --no-color

  # The marker `duplicate` looks for. It needs every other job, with no status function in its
  # condition, so it is written only when all of them succeeded, and never by a run that
  # skipped them. Only a push writes one: its run read no cache, and a fork cannot push.
  passed:
    name: record the pass
    needs: [duplicate, verify, e2e, self-host, self-host-worker]
    if: needs.duplicate.outputs.skip != 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TREE: ${{ needs.duplicate.outputs.tree }}
        run: echo "$TREE" > ci-passed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ci-passed-${{ needs.duplicate.outputs.tree }}
          path: ci-passed.txt
          if-no-files-found: error
          retention-days: 14
