# Every version the Kotlin SDK's build uses, pinned exactly. No ranges and no "latest".
[versions]
kotlin = "2.4.21"
serialization = "1.12.0"
coroutines = "1.11.0"
kover = "0.9.11"
agp = "9.4.1"
# The Android adapters' only libraries: Credential Manager and what it needs (ADR 0054).
credentials = "1.6.0"
googleid = "1.2.1"
# The Compose screens (tula-auth-compose) and their example app. Foundation and UI only: no
# Material, so an app is not tied to a version of it. 1.11 is the newest line that compiles
# against the API level this build pins (36.1); 1.12 asks for 37.
compose = "1.11.4"
activity-compose = "1.13.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
# Named because the Espresso that Compose's test library brings asks Android for a method
# (InputManager.getInstance) that newer system images no longer have: every test then fails
# before it starts. 3.7.0 no longer asks.
androidx-test-espresso = "3.7.0"

[libraries]
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
